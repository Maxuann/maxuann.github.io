<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        /* 不要去掉absolut和inset属性，这样写防止loading页可滚动 */
        .container {
            background-color: #070E26;
            position: absolute;
            inset: 0;
        }

        .bg {
            width: 100vw;
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-70%);
        }

        .bg img {
            width: 100%;
            animation: bgSwitch 12s linear infinite;
        }

        .bg img:not(:first-child) {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
        }

        .bg img:nth-child(2) {
            animation-delay: 4s;
        }

        .bg img:nth-child(3) {
            animation-delay: 8s;
        }

        .loading {
            position: absolute;
            top: 80%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            font-size: 16px;
        }

        .loading img {
            width: 30px;
            margin-bottom: 15px;
        }

        @keyframes bgSwitch {

            0%,
            100% {
                opacity: 0;
            }

            7%,
            26% {
                opacity: 1;
            }

            33% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="bg">
            <img src="./img/1.jpg" alt="">
            <img src="./img/2.jpg" alt="">
            <img src="./img/3.jpg" alt="">
        </div>
        <div class="loading">
            <img src="./img/blocks-shuffle.svg" alt="">
            <p>正在加载<br>...</p>
        </div>
    </div>

</body>

</html>
