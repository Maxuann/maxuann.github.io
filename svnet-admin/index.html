<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 — 胜维科技官网</title>
  <meta name="description" content="胜维科技官网内容管理后台：产品演示、内容中心、新闻中心、核心服务、关于我们、首页与联系信息的增删改。" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- ============ 应用外壳 ============ -->
  <div class="app" data-od-id="app-shell">

    <!-- ============ 侧边栏 ============ -->
    <aside class="sidebar" id="sidebar" data-od-id="sidebar">
      <div class="sidebar-brand" data-od-id="sidebar-brand">
        <img class="brand-logo" src="../logo.png" alt="胜维科技Shengwei Tech" />
      </div>

      <nav class="sidebar-nav" id="sidebar-nav" aria-label="后台导航" data-od-id="sidebar-nav">
        <div class="nav-group-label">概览</div>
        <button type="button" class="nav-item active" data-module="overview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          <span>概览</span>
        </button>

        <div class="nav-group-label">页面</div>
        <button type="button" class="nav-item" data-module="home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
          <span>首页</span>
          <span class="nav-count" data-count="home">0</span>
        </button>
        <button type="button" class="nav-item" data-module="about">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>
          <span>关于我们</span>
          <span class="nav-count" data-count="about">3</span>
        </button>
        <button type="button" class="nav-item" data-module="services">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/></svg>
          <span>核心服务</span>
          <span class="nav-count" data-count="services">0</span>
        </button>
        <button type="button" class="nav-item" data-module="platforms">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 9h20M9 4v16"/></svg>
          <span>产品演示</span>
          <span class="nav-count" data-count="platforms">0</span>
        </button>
        <button type="button" class="nav-item" data-module="articles">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6M9 9h2"/></svg>
          <span>内容中心</span>
          <span class="nav-count" data-count="articles">0</span>
        </button>
        <button type="button" class="nav-item" data-module="news">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0V9"/><path d="M11 8h6M11 12h6M11 16h4"/></svg>
          <span>新闻中心</span>
          <span class="nav-count" data-count="news">0</span>
        </button>
        <button type="button" class="nav-item" data-module="contact">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.69-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.5 8.5 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8.3 8.3z"/></svg>
          <span>联系我们</span>
          <span class="nav-count" data-count="contact">0</span>
        </button>

        <div class="nav-group-label">系统</div>
        <button type="button" class="nav-item" data-module="accounts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>账号与角色</span>
          <span class="nav-count" data-count="accounts">0</span>
        </button>
        <button type="button" class="nav-item" data-module="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1.51 1.41 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>全局设置</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="foot-actions">
          <a class="foot-btn" href="../index.html" target="_blank" rel="noopener" data-od-id="goto-front">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg>
            查看站点
          </a>
          <button type="button" class="foot-btn danger" id="btn-reset" data-od-id="btn-reset">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            重置数据
          </button>
        </div>
      </div>
    </aside>

    <div class="mobile-scrim" id="mobile-scrim" aria-hidden="true"></div>

    <!-- ============ 主区域 ============ -->
    <div class="main" data-od-id="main">
      <header class="topbar" data-od-id="topbar">
        <button type="button" class="mobile-menu-btn" id="mobile-menu-btn" aria-label="打开菜单" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="topbar-right">
          <div class="topbar-acct" data-od-id="topbar-acct">
            <div class="foot-avatar" id="foot-avatar" aria-hidden="true">管</div>
            <div class="topbar-acct-text">
              <div class="foot-name" id="foot-name">超级管理员</div>
              <div class="foot-role" id="foot-role">内容运营</div>
            </div>
          </div>
        </div>
      </header>

      <main class="content" id="view" data-od-id="content-view" aria-live="polite">
        <!-- 由 admin.js 渲染当前模块 -->
      </main>
    </div>
  </div>

  <!-- ============ 通用弹窗（由 admin.js 驱动） ============ -->
  <div class="modal-overlay" id="modal-overlay" aria-hidden="true" data-od-id="modal-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="modal-box">
      <div class="modal-head">
        <div>
          <h3 id="modal-title">标题</h3>
          <div class="modal-sub" id="modal-sub"></div>
        </div>
        <button type="button" class="modal-close" id="modal-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot" id="modal-foot" hidden></div>
    </div>
  </div>

  <!-- ============ Toast 通知栈 ============ -->
  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false" data-od-id="toast-stack"></div>

  <script src="admin-data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
